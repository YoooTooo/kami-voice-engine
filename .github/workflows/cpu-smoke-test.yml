name: RVC CPU batch conversion

on:
  workflow_call:
    inputs:
      request_id:
        description: 'Request ID: letters, numbers, dot, underscore, hyphen'
        required: true
        type: string
      expected_count:
        description: 'Expected number of audio files; 0 accepts any positive count'
        required: false
        default: '0'
        type: string
      pitch:
        description: 'RVC pitch from -24 to 24'
        required: false
        default: '2'
        type: string
      engine_ref:
        description: 'kami-voice-engine Git ref containing kami_voice.py'
        required: false
        default: 'main'
        type: string
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_ENDPOINT:
        required: true
    outputs:
      result_prefix:
        description: 'Private R2 prefix containing the converted result'
        value: ${{ jobs.convert.outputs.result_prefix }}

  workflow_dispatch:
    inputs:
      request_id:
        description: 'Request ID: letters, numbers, dot, underscore, hyphen'
        required: true
        type: string
      expected_count:
        description: 'Expected number of audio files; 0 accepts any positive count'
        required: true
        default: '0'
        type: string
      pitch:
        description: 'RVC pitch from -24 to 24'
        required: true
        default: '2'
        type: string
      engine_ref:
        description: 'kami-voice-engine Git ref containing kami_voice.py'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: kami-rvc-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  convert:
    outputs:
      result_prefix: ${{ steps.save-result.outputs.result_prefix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_PAGER: ''
      R2_BUCKET: kami-voice-private
      REQUEST_ID: ${{ inputs.request_id }}
      EXPECTED_COUNT: ${{ inputs.expected_count }}
      RVC_PITCH: ${{ inputs.pitch }}

    steps:
      - name: Start measurement
        run: |
          echo "KAMI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          echo "KAMI_TEST_DIR=$RUNNER_TEMP/kami-cpu-test" >> "$GITHUB_ENV"

      - name: Checkout Kami
        uses: actions/checkout@v7
        with:
          repository: YoooTooo/kami-voice-engine
          ref: ${{ inputs.engine_ref }}
          persist-credentials: false

      - name: Checkout the tested Applio revision
        uses: actions/checkout@v7
        with:
          repository: IAHispano/Applio
          ref: 085197e738ce9dd4c0bae1e0a74df5de25b89444
          path: applio
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'

      - name: Validate request and prepare directories
        run: |
          test "$(git -C applio rev-parse HEAD)" = 085197e738ce9dd4c0bae1e0a74df5de25b89444
          test -f kami_voice.py
          mkdir -p "$KAMI_TEST_DIR/models" "$KAMI_TEST_DIR/input" "$KAMI_TEST_DIR/result"
          python - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path
          request_id = os.environ['REQUEST_ID']
          expected_count = os.environ['EXPECTED_COUNT']
          pitch = os.environ['RVC_PITCH']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,79}', request_id):
              raise SystemExit('Invalid request_id.')
          if not expected_count.isdigit() or not 0 <= int(expected_count) <= 100:
              raise SystemExit('expected_count must be an integer from 0 to 100.')
          try:
              pitch_number = int(pitch)
          except ValueError:
              raise SystemExit('pitch must be an integer.')
          if not -24 <= pitch_number <= 24:
              raise SystemExit('pitch must be from -24 to 24.')
          # Stop on source mismatch instead of silently testing another CLI.
          expected = {
              'core.py': 'cbdfcefe9987b076467ea063cd89c88bd08f0dcef105ebf4edbcd62c7e441940',
              'requirements.txt': '8480329e18b22f2c1ca58a480f9154472eafd05f9b5c05fae0cbb8c60864e84c',
          }
          for name, digest in expected.items():
              data = (Path('applio') / name).read_bytes().replace(b'\r\n', b'\n')
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f'{name} differs from the supplied Mac file. Review before continuing.')
          PY

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libportaudio2 libsndfile1 time
          aws --version

      - name: Install CPU dependencies (cold start)
        timeout-minutes: 20
        run: |
          python -m venv applio/.venv
          applio/.venv/bin/python -m pip install --upgrade pip
          /usr/bin/time -v applio/.venv/bin/python -m pip install --no-cache-dir \
            torch==2.11.0 torchaudio==2.11.0 torchvision==0.26.0 \
            --index-url https://download.pytorch.org/whl/cpu
          applio/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import torch, torchaudio, torchvision
          packages = [('torch', torch), ('torchaudio', torchaudio), ('torchvision', torchvision)]
          constraints = ''.join(f'{name}=={module.__version__}\n' for name, module in packages)
          (Path(os.environ['KAMI_TEST_DIR']) / 'cpu-constraints.txt').write_text(constraints)
          assert torch.version.cuda is None, 'Expected a CPU-only PyTorch wheel'
          PY
          /usr/bin/time -v applio/.venv/bin/python -m pip install --no-cache-dir \
            -c "$KAMI_TEST_DIR/cpu-constraints.txt" -r applio/requirements.txt python-ffmpeg
          applio/.venv/bin/python -m pip check
          applio/.venv/bin/python -m pip freeze > "$KAMI_TEST_DIR/result/packages.txt"

      - name: Download request inputs and private models
        timeout-minutes: 5
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo 'Missing R2_ACCESS_KEY_ID'; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo 'Missing R2_SECRET_ACCESS_KEY'; exit 1; }
          test -n "$R2_ENDPOINT" || { echo 'Missing R2_ENDPOINT'; exit 1; }
          /usr/bin/time -v aws s3 cp "s3://$R2_BUCKET/amaterasu/amaterasu.pth" \
            "$KAMI_TEST_DIR/models/amaterasu.pth" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          /usr/bin/time -v aws s3 cp "s3://$R2_BUCKET/amaterasu/amaterasu.index" \
            "$KAMI_TEST_DIR/models/amaterasu.index" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 sync "s3://$R2_BUCKET/jobs/$REQUEST_ID/input/" \
            "$KAMI_TEST_DIR/input/" --endpoint-url "$R2_ENDPOINT" --only-show-errors

      - name: Validate request inputs
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from kami_voice import AUDIO_EXTENSIONS
          folder = Path(os.environ['KAMI_TEST_DIR']) / 'input'
          files = sorted(p for p in folder.iterdir()
                         if p.is_file() and p.suffix.lower() in AUDIO_EXTENSIONS)
          nested = [p for p in folder.rglob('*') if p.is_file() and p.parent != folder]
          if nested:
              raise SystemExit('Input must be a flat folder without nested files.')
          if not files:
              raise SystemExit('No supported audio inputs were downloaded.')
          expected = int(os.environ['EXPECTED_COUNT'])
          if expected and len(files) != expected:
              raise SystemExit(f'Expected {expected} audio files, found {len(files)}.')
          for file in files:
              print(file.name, file.stat().st_size, 'bytes')
          PY

      - name: Download auxiliary inference models
        timeout-minutes: 10
        working-directory: applio
        run: |
          /usr/bin/time -v .venv/bin/python core.py prerequisites \
            --no-pretraineds-hifigan --models --no-exe

      - name: Verify CPU device
        working-directory: applio
        run: |
          .venv/bin/python - <<'PY'
          import torch
          from rvc.configs.config import Config
          device = str(Config().device)
          print('PyTorch:', torch.__version__, 'Applio device:', device)
          assert torch.version.cuda is None
          assert device == 'cpu', f'Expected CPU, got {device}'
          PY

      - name: Convert request in one batch
        timeout-minutes: 20
        run: |
          count_args=()
          if [[ "$EXPECTED_COUNT" != "0" ]]; then
            count_args=(--expected-count "$EXPECTED_COUNT")
          fi
          /usr/bin/time -v -o "$KAMI_TEST_DIR/result/inference-time.txt" \
            python kami_voice.py batch "$KAMI_TEST_DIR/input" \
            --output "$KAMI_TEST_DIR/result/audio" "${count_args[@]}" \
            --applio-dir "$GITHUB_WORKSPACE/applio" \
            --python "$GITHUB_WORKSPACE/applio/.venv/bin/python" \
            --model "$KAMI_TEST_DIR/models/amaterasu.pth" \
            --index "$KAMI_TEST_DIR/models/amaterasu.index" \
            --pitch "$RVC_PITCH" --timeout-seconds 1080

      - name: Save result to private R2 only
        id: save-result
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          result_prefix="jobs/$REQUEST_ID/output/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # Only validated audio and reports are uploaded; models stay in runner temp.
          aws s3 sync "$KAMI_TEST_DIR/result/audio/" "s3://$R2_BUCKET/$result_prefix/audio/" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 cp "$KAMI_TEST_DIR/result/inference-time.txt" \
            "s3://$R2_BUCKET/$result_prefix/inference-time.txt" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 cp "$KAMI_TEST_DIR/result/packages.txt" \
            "s3://$R2_BUCKET/$result_prefix/packages.txt" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "result_prefix=$result_prefix" >> "$GITHUB_OUTPUT"
          echo "Private batch: s3://$R2_BUCKET/$result_prefix/" >> "$GITHUB_STEP_SUMMARY"

      - name: Measurement summary (also on failure)
        if: ${{ always() }}
        env:
          KAMI_JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import os, time
          from pathlib import Path
          elapsed = int(time.time()) - int(os.environ['KAMI_STARTED'])
          report = Path(os.environ['KAMI_TEST_DIR']) / 'result/inference-time.txt'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'\nStatus before summary: {os.environ["KAMI_JOB_STATUS"]}\n\n')
              out.write(f'Elapsed since first step: {elapsed} seconds (not billed minutes).\n\n')
              out.write(f'Request ID: `{os.environ["REQUEST_ID"]}`\n\n')
              out.write('Cold run: no dependency/model cache. Inspect step durations for setup/download costs.\n\n')
              if report.exists():
                  out.write('```text\n' + report.read_text() + '\n```\n')
          PY